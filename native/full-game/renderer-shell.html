<!doctype html><html><head><meta charset="utf-8"><title>Running original renderer checks</title>
<style>html,body{margin:0;background:white;min-height:100%;}canvas{display:block;width:min(100vw,calc(100dvh * 4 / 3));height:auto;aspect-ratio:4/3;margin:auto;background:black;}pre{white-space:pre-wrap}</style>
</head><body><canvas id="canvas" width="640" height="480"></canvas><pre id="result">Starting original PDDI renderer…</pre>
<script>
var Module={canvas:document.getElementById('canvas'),
 print:function(text){document.getElementById('result').textContent+='\n'+text;if(text.startsWith('PASS:'))document.title=text;},
 printErr:function(text){document.getElementById('result').textContent+='\n'+text;},
 onAbort:function(reason){document.title='FAIL: '+reason;},
 onExit:function(code){if(code!==0)document.title='FAIL: renderer check returned '+code;}
};
window.addEventListener('error',function(e){document.title='FAIL: '+e.message;});
window.addEventListener('unhandledrejection',function(e){document.title='FAIL: '+e.reason;});
</script>{{{ SCRIPT }}}</body></html>
